services:
  backend:
    build:
      context: "./backend"
    env_file:
      - ".env"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
        
  nginx:
    build:
      context: "./frontend"
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 3s

volumes:
  postgres_data: