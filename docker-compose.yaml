services:
  backend:
    build:
      context: "./backend"
    env_file:
      - ".env"
    ports:
      - "8000:8000"

  nginx:
    build:
      context: "./frontend"
    ports:
      - "8080:80"
    
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

volumes:
  postgres_data: